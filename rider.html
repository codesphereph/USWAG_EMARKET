<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>USWAG E-MARKET Rider</title>
<meta name="theme-color" content="#0A1F6E">
<link rel="manifest" href="manifest-rider.json">
<link rel="icon" href="icons/icon-rider-192.png">
<link rel="apple-touch-icon" href="icons/icon-rider-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USWAG Rider">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* USWAG E-MARKET · shared styles (navy/blue palette from the TSKI proposal) */
:root {
  --forest: #0A1F6E;
  --leaf: #0B5ED0;
  --leaf-soft: #DCE7FA;
  --mango: #B7791F;
  --mango-soft: #FDF2D8;
  --coral: #C0392B;
  --coral-soft: #F8E0DD;
  --paper: #F3F5F9;
  --card: #FFFFFF;
  --line: #D5DCE8;
  --ink: #1B2533;
  --muted: #56627A;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --display: 'Source Sans 3', Calibri, Carlito, system-ui, sans-serif;
  --body: 'Source Sans 3', Calibri, Carlito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gold: #EEB738;
  --green: #2E7D32;
  --green-soft: #E3F1E4;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body); font-size: 15px; line-height: 1.5; color: var(--ink);
  background: var(--paper); min-height: 100vh; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
a { color: var(--leaf); }
.hidden { display: none !important; }
:focus-visible { outline: 3px solid #7FA8FF; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

h1, h2, h3 { font-family: var(--display); line-height: 1.15; color: var(--forest); letter-spacing: -0.005em; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }

/* ---------- App shell (phone apps) ---------- */
.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(84px + var(--safe-b)); }
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--paper);
  padding: calc(14px + var(--safe-t)) 18px 12px; display: flex; align-items: center; gap: 12px;
}
.topbar .brand { font-family: var(--display); font-weight: 800; font-size: 19px; color: var(--forest); letter-spacing: -0.02em; }
.topbar .brand span { color: var(--mango); }
.topbar .brand.withlogo { display: flex; align-items: center; gap: 9px; }
.page { padding: 4px 18px 24px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 10px; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--card);
  border-top: 1px solid var(--line); padding: 6px 6px calc(6px + var(--safe-b));
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: flex; }
.tab {
  flex: 1; background: none; border: 0; padding: 6px 2px; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted);
  position: relative;
}
.tab svg { width: 23px; height: 23px; stroke: currentColor; }
.tab.active { color: var(--forest); font-weight: 650; }
.tab.active svg { stroke: var(--leaf); }
.badge {
  position: absolute; top: 0; right: calc(50% - 22px); background: var(--coral); color: #fff;
  font-size: 10.5px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- Cards & lists ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }
.card.flat { border: 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.list-item { padding: 13px 16px; display: flex; gap: 12px; align-items: center; }
.list-item + .list-item { border-top: 1px solid var(--line); }
.list-item.tap { cursor: pointer; }
.list-item.tap:active { background: var(--paper); }
.empty { text-align: center; padding: 34px 20px; color: var(--muted); }
.empty h3 { margin-bottom: 6px; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; padding: 3px 9px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); white-space: nowrap; }
.pill.mango { background: var(--mango-soft); color: #8A5A00; }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.red { background: var(--coral-soft); color: #9B2C20; }
.pill.coral { background: var(--coral-soft); color: #A93A19; }
.pill.grey { background: #ECEEF4; color: var(--muted); }
.pill.dark { background: var(--forest); color: #fff; }

.avatar {
  width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; background: var(--leaf-soft); color: var(--forest);
  display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 19px;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--leaf-soft); flex-shrink: 0; }

/* ---------- Forms ---------- */
label.field { display: block; }
label.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 11px 13px; font-size: 16px; outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--leaf); }
textarea.input { min-height: 78px; resize: vertical; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--leaf); margin-top: 1px; flex-shrink: 0; }

.seg { display: flex; background: #E7EAF4; border-radius: 12px; padding: 4px; gap: 4px; }
.seg button {
  flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 9px; font-weight: 600; font-size: 14px;
  color: var(--muted); cursor: pointer;
}
.seg button.on { background: var(--card); color: var(--forest); box-shadow: 0 1px 3px rgba(10,31,110,.15); }

.choice { display: grid; gap: 10px; }
.choice.two { grid-template-columns: 1fr 1fr; }
.choice label {
  border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 13px; cursor: pointer; background: var(--card);
  display: block;
}
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice label:has(input:checked) { border-color: var(--leaf); background: var(--leaf-soft); }
.choice strong { display: block; font-family: var(--display); color: var(--forest); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--forest); color: #fff; font-weight: 650; font-size: 15px; padding: 12px 18px;
  border-radius: 12px; text-decoration: none; transition: transform .08s, opacity .15s; white-space: nowrap;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.mango { background: var(--leaf); color: #fff; }
.btn.gold { background: var(--gold); color: var(--forest); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--line); }
.btn.danger { background: var(--coral-soft); color: #A93A19; }
.btn.sm { padding: 7px 12px; font-size: 13.5px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn.icon { padding: 8px; border-radius: 10px; background: transparent; color: var(--forest); }
.btn.icon svg { width: 22px; height: 22px; }
.btn .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Auth screen ---------- */
.auth { max-width: 440px; margin: 0 auto; padding: calc(40px + var(--safe-t)) 22px 40px; }
.auth-logo { width: 150px; height: 150px; display: block; margin: 0 auto 6px; }
.auth .auth-sub { text-align: center; }
.logo-sm { width: 38px; height: 38px; flex-shrink: 0; }
.auth-mark { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -0.035em; color: var(--forest); line-height: 1; }
.auth-mark span { color: var(--mango); }
.auth-sub { color: var(--muted); margin: 8px 0 26px; }

/* ---------- Sheets / modals ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10,31,110,.45); display: flex;
  align-items: flex-end; justify-content: center; animation: fade .15s;
}
.sheet {
  background: var(--paper); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 8px 18px calc(22px + var(--safe-b));
  animation: up .2s ease-out;
}
.sheet-grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
@media (min-width: 700px) {
  .overlay { align-items: center; }
  .sheet { border-radius: var(--r-lg); max-width: 520px; }
  .sheet-grab { display: none; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: .6; } }

.toast-wrap { position: fixed; left: 0; right: 0; top: calc(12px + var(--safe-t)); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast {
  background: var(--forest); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; font-weight: 550;
  max-width: 480px; box-shadow: 0 6px 20px rgba(10,31,110,.25); animation: up .2s ease-out; pointer-events: auto;
}
.toast.error { background: var(--coral); }

/* ---------- Money summary ---------- */
.sum { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.sum td { padding: 5px 0; }
.sum td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.sum tr.total td { border-top: 1.5px solid var(--line); padding-top: 10px; font-weight: 700; font-size: 17px; color: var(--forest); }
.sum tr.minus td:last-child { color: var(--leaf); }

/* ---------- Status steps ---------- */
.steps { display: flex; gap: 4px; margin: 10px 0 4px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.done { background: var(--leaf); }
.steps i.now { background: var(--mango); }

/* ---------- Qty stepper ---------- */
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: var(--card); }
.qty button { width: 34px; height: 34px; border: 0; background: none; font-size: 19px; font-weight: 700; color: var(--forest); cursor: pointer; }
.qty span { min-width: 24px; text-align: center; font-weight: 700; }
.add-btn { width: 36px; height: 36px; border-radius: 11px; border: 0; background: var(--leaf); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

.cartbar {
  position: fixed; left: 0; right: 0; bottom: calc(76px + var(--safe-b)); z-index: 25; padding: 0 14px;
}
.cartbar .btn { max-width: 532px; margin: 0 auto; display: flex; width: 100%; justify-content: space-between; padding: 14px 18px; box-shadow: 0 8px 22px rgba(10,31,110,.3); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--forest); }
.chip.on { background: var(--forest); color: #fff; border-color: var(--forest); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.stat b { display: block; font-family: var(--display); font-size: 24px; color: var(--forest); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12.5px; color: var(--muted); }

.bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 8px; }
.bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bars i { width: 100%; background: var(--leaf); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.bars span { font-size: 11px; color: var(--muted); }

.banner { background: var(--mango-soft); border-radius: var(--r-md); padding: 13px 15px; font-size: 14px; }
.banner.green { background: var(--leaf-soft); }
.banner.coral { background: var(--coral-soft); }
.banner strong { color: var(--forest); }

/* ---------- Chat ---------- */
.chat-log { display: flex; flex-direction: column; gap: 8px; min-height: 240px; max-height: 50vh; overflow-y: auto; padding: 4px 0 10px; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 14.5px; }
.msg.me { align-self: flex-end; background: var(--forest); color: #fff; border-color: var(--forest); }
.msg small { display: block; font-size: 11px; opacity: .7; margin-bottom: 2px; }

/* ---------- Customer suki card (the signature element) ---------- */
.suki {
  position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px 20px 18px; color: #fff;
  background: linear-gradient(135deg, #0A1F6E 0%, #0B3C9E 60%, #0B5ED0 100%);
}
.suki::after {
  content: ''; position: absolute; width: 260px; height: 90px; right: -60px; top: 18px; border-radius: 50%;
  border: 10px solid rgba(255,255,255,.14); transform: rotate(-18deg); pointer-events: none;
}
.suki-top { display: flex; justify-content: space-between; align-items: flex-start; }
.suki-label { font-size: 13px; opacity: .78; }
.suki-bal { font-family: var(--display); font-weight: 700; font-size: 36px; letter-spacing: -0.02em; line-height: 1.1; margin-top: 2px; }
.suki-pts { text-align: right; }
.suki-pts b { display: block; font-family: var(--display); font-size: 26px; color: #fff; line-height: 1.1; }
.suki-meter { margin-top: 18px; }
.suki-meter .track { height: 8px; background: rgba(255,255,255,.18); border-radius: 4px; overflow: hidden; }
.suki-meter .fill { height: 100%; background: #fff; border-radius: 4px; transition: width .4s; }
.suki-meter .fill.over { background: #FFB4A0; }
.suki-meter .row { font-size: 12.5px; opacity: .85; margin-top: 6px; }
.suki-actions { display: flex; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.suki-actions .btn.mango { background: #fff; color: var(--forest); }
.suki-actions .btn { flex: 1; padding: 10px; font-size: 14px; }
.suki-actions .btn.ghost { color: #fff; border-color: rgba(255,255,255,.3); }

/* ---------- Admin (desktop) ---------- */
.admin { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: var(--forest); color: #fff; padding: 22px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side .brand { font-family: var(--display); font-weight: 800; font-size: 19px; padding: 0 6px 18px; display: flex; align-items: center; gap: 10px; }
.side .brand img { width: 46px; height: 46px; }
.side .brand span { color: #B99BFF; }
.side button {
  width: 100%; text-align: left; background: none; border: 0; color: rgba(255,255,255,.78); padding: 10px 12px;
  border-radius: 10px; cursor: pointer; font-weight: 550; display: flex; justify-content: space-between; align-items: center;
}
.side button:hover { background: rgba(255,255,255,.07); color: #fff; }
.side button.on { background: rgba(255,255,255,.14); color: #fff; }
.side button .badge { position: static; }
.main { padding: 26px 30px 60px; min-width: 0; }
.main-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 650; padding: 11px 14px; border-bottom: 1px solid var(--line); background: #F9FAFD; white-space: nowrap; }
table.data td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data td.r, table.data th.r { text-align: right; font-variant-numeric: tabular-nums; }
.menu-btn { display: none; }
@media (max-width: 860px) {
  .admin { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 90; width: 250px; left: -260px; transition: left .2s; }
  .side.open { left: 0; }
  .main { padding: calc(16px + var(--safe-t)) 16px 60px; }
  .menu-btn { display: inline-flex; }
}

/* ---------- Opening intro (rising bars → wordmark) ---------- */
.intro { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0A1F6E 0%, #0B3C9E 55%, #0B5ED0 100%); color: #fff; overflow: hidden;
  clip-path: inset(0 0 0 0); cursor: pointer; user-select: none; }
.intro-logo { width: min(62vw, 250px); height: auto; border-radius: 50%; position: relative; z-index: 1;
  box-shadow: 0 20px 50px rgba(0,8,50,.5); animation: logoPop .9s cubic-bezier(.2,1.4,.4,1) .1s both, logoPulse 1.1s ease-out 1.05s both; }
.intro-stage { position: relative; display: grid; place-items: center; }
.intro-ring { position: absolute; width: 128%; height: 128%; transform: rotate(-90deg); }
.intro-ring circle { fill: none; stroke: #EEB738; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 315; stroke-dashoffset: 315; animation: draw 1.1s cubic-bezier(.6,0,.2,1) .45s forwards; }
.intro-ring circle.dots { stroke: rgba(255,255,255,.35); stroke-width: 1; stroke-dasharray: 1 5; stroke-dashoffset: 0; animation: spin 18s linear infinite; transform-origin: center; }
@keyframes logoPop { from { transform: scale(.4) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes logoPulse { from { box-shadow: 0 20px 50px rgba(0,8,50,.5), 0 0 0 0 rgba(238,183,56,.7); } to { box-shadow: 0 20px 50px rgba(0,8,50,.5), 0 0 0 34px rgba(238,183,56,0); } }
.intro-word { margin-top: 26px; font-family: var(--display); font-weight: 800; font-size: clamp(34px, 10vw, 46px); letter-spacing: .02em; line-height: 1; animation: introUp .5s ease-out 1.1s both; }
.intro-word span { font-weight: 600; letter-spacing: .22em; font-size: .46em; display: block; margin-top: 8px; opacity: .9; }
.intro-tag { margin-top: 18px; font-size: 16px; font-style: italic; opacity: .92; animation: introUp .5s ease-out 1.6s both; }
.intro-chain { position: absolute; bottom: calc(34px + var(--safe-b)); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
.intro-chain i { font-style: normal; padding: 4px 9px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); opacity: 0; animation: introUp .35s ease-out both; }
.intro-role { margin-top: 14px; font-size: 12.5px; font-weight: 700; padding: 5px 14px; background: rgba(255,255,255,.14); border-radius: 999px; animation: introUp .5s ease-out 1.7s both; }
.intro.out { animation: introOut .6s cubic-bezier(.7,0,.3,1) forwards; pointer-events: none; }
@keyframes barUp { from { transform: scaleY(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes tip { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes introUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes introOut { to { clip-path: inset(0 0 100% 0); } }
@media (prefers-reduced-motion: reduce) {
  .intro, .intro * { animation-duration: .01s !important; animation-delay: 0s !important; }
  .intro.out { animation: introFade .3s forwards !important; }
  @keyframes introFade { to { opacity: 0; } }
}

/* ---------- Status lights (early warning) ---------- */
.light { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; }
.light::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.light.GREEN { background: var(--green-soft); color: var(--green); }
.light.AMBER { background: var(--mango-soft); color: #8A5A00; }
.light.RED { background: var(--coral-soft); color: #9B2C20; }
.light.NEW { background: #E8ECF3; color: var(--muted); }
.otp { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: .3em; color: var(--forest); background: var(--leaf-soft); border-radius: 12px; padding: 6px 4px 6px 16px; display: inline-block; }
.stepper { display: flex; gap: 0; margin: 6px 0 2px; }
.stepper div { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); position: relative; padding-top: 22px; }
.stepper div::before { content: ''; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; border-radius: 50%; background: var(--line); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); z-index: 1; }
.stepper div::after { content: ''; position: absolute; top: 10px; left: -50%; right: 50%; height: 3px; background: var(--line); }
.stepper div:first-child::after { display: none; }
.stepper div.done::before, .stepper div.done::after, .stepper div.now::after { background: var(--leaf); }
.stepper div.now::before { background: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.stepper div.done, .stepper div.now { color: var(--forest); font-weight: 650; }
.stars { display: inline-flex; gap: 2px; color: var(--gold); }
.stars button { background: none; border: 0; font-size: 30px; color: #C9D2E3; cursor: pointer; padding: 0 2px; line-height: 1; }
.stars button.on { color: var(--gold); }
.docrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.docrow + .docrow { border-top: 1px solid var(--line); }
.docrow .ok { color: var(--green); font-weight: 700; }

/* ---------- Install banner ---------- */
.install-banner {
  position: fixed; left: 12px; right: 12px; z-index: 60; max-width: 536px; margin: 0 auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
  display: grid; grid-template-columns: 48px 1fr auto; column-gap: 12px; row-gap: 12px; align-items: center;
  box-shadow: 0 14px 38px rgba(10,31,110,.28); animation: bannerIn .45s cubic-bezier(.2,1.2,.4,1) both;
}
.install-banner [data-install] { grid-column: 1 / -1; width: 100%; padding: 11px; font-size: 15px; }
.install-banner::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; border-radius: 18px 18px 0 0;
  background: linear-gradient(90deg, var(--forest), var(--leaf)); }
.install-banner img { width: 48px; height: 48px; flex-shrink: 0; }
.install-banner b { display: block; font-family: var(--display); color: var(--forest); font-size: 15.5px; line-height: 1.2; }
.install-banner .small { line-height: 1.35; }
.install-banner .x { background: none; border: 0; color: var(--muted); padding: 6px; cursor: pointer; align-self: flex-start; margin: -4px -4px 0 0; }
.install-banner .x svg { width: 18px; height: 18px; }
.install-banner.bye { animation: bannerOut .3s ease-in forwards; }
@keyframes bannerIn { from { transform: translateY(120%); opacity: 0; } }
@keyframes bannerOut { to { transform: translateY(120%); opacity: 0; } }

</style>
<style>
  .cashcard { background: linear-gradient(135deg, #0A1F6E, #0B5ED0); color: #fff; border-radius: var(--r-lg); padding: 16px 18px; }
  .cashcard b { font-family: var(--display); font-size: 28px; display: block; }
  .otp-in { font-family: var(--display); font-size: 30px; letter-spacing: .4em; text-align: center; font-weight: 800; }
</style>

    if (!url || url.indexOf('PASTE') === 0) throw new Error('The app is not connected yet. Put your Apps Script URL in config.js.');
    let res;
    try {
      res = await fetch(url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({ action, data: data || {}, token: S.token() }),
      });
    } catch (e) {
      throw new Error('No internet connection. Check your signal and try again.');
    }
    let out;
    try { out = await res.json(); } catch (e) { throw new Error('The server did not respond properly. Try again in a moment.'); }
    if (!out.ok) {
      if (out.code === 'AUTH' && S.token()) { S.setToken(null); setTimeout(() => location.reload(), 1200); }
      throw new Error(out.error || 'Something went wrong.');
    }
    return out.data;
  };

  // ---------- Formatting ----------
  S.esc = v => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  S.peso = n => (Number(n) < 0 ? '−₱' : '₱') + Math.abs(Number(n || 0)).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  S.peso0 = n => (Number(n) < 0 ? '−₱' : '₱') + Math.abs(Number(n || 0)).toLocaleString('en-PH', { maximumFractionDigits: 2 });
  S.when = iso => {
    if (!iso) return '';
    const d = new Date(iso), now = new Date();
    const time = d.toLocaleTimeString('en-PH', { hour: 'numeric', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today, ' + time;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return 'Yesterday, ' + time;
    return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined }) + ', ' + time;
  };
  S.dateOnly = iso => iso ? new Date(iso).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  S.initial = name => S.esc(String(name || '?').trim().charAt(0).toUpperCase());
  S.$ = (sel, root) => (root || document).querySelector(sel);
  S.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  S.form = el => Object.fromEntries(new FormData(el).entries());

  // ---------- Toasts ----------
  S.toast = function (msg, type) {
    let wrap = S.$('.toast-wrap');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'toast-wrap'; wrap.setAttribute('aria-live', 'polite'); document.body.appendChild(wrap); }
    const t = document.createElement('div');
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    t.textContent = msg;
    wrap.appendChild(t);
    while (wrap.children.length > 2) wrap.firstChild.remove();
    setTimeout(() => t.remove(), type === 'error' ? 5200 : 3200);
  };
  S.error = e => S.toast(e && e.message ? e.message : String(e), 'error');

  // ---------- Button busy state ----------
  S.busy = async function (btn, fn) {
    if (!btn || btn.disabled) return;
    const html = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';
    try { return await fn(); }
    catch (e) { S.error(e); }
    finally { btn.disabled = false; btn.innerHTML = html; }
  };

  // ---------- Sheets (bottom modals) ----------
  S.sheet = function (title, html, opts) {
    opts = opts || {};
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${S.esc(title)}">
      <div class="sheet-grab"></div>
      <div class="sheet-head"><h2>${S.esc(title)}</h2>
        <button class="btn icon" data-close aria-label="Close">${S.icon('x')}</button></div>
      <div class="sheet-body">${html}</div></div>`;
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); opts.onClose && opts.onClose(); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    const first = ov.querySelector('input, select, textarea');
    if (first && window.innerWidth > 700) first.focus();
    return { el: ov.querySelector('.sheet-body'), close, root: ov };
  };

  S.confirm = function (title, message, okLabel, danger) {
    return new Promise(resolve => {
      const sh = S.sheet(title, `<p class="muted">${S.esc(message)}</p>
        <div class="row" style="margin-top:18px"><button class="btn ghost grow" data-no>Keep it</button>
        <button class="btn grow ${danger ? 'danger' : ''}" data-yes>${S.esc(okLabel || 'Confirm')}</button></div>`,
      { onClose: () => resolve(false) });
      sh.el.querySelector('[data-no]').onclick = () => sh.close();
      sh.el.querySelector('[data-yes]').onclick = () => { resolve(true); sh.root.remove(); };
    });
  };

  S.prompt = function (title, label, opts) {
    opts = opts || {};
    return new Promise(resolve => {
      const sh = S.sheet(title, `<form class="stack">
        ${opts.message ? `<p class="muted">${S.esc(opts.message)}</p>` : ''}
        <label class="field"><span>${S.esc(label)}</span>
        <input class="input" name="v" type="${opts.type || 'text'}" ${opts.required === false ? '' : 'required'} value="${S.esc(opts.value || '')}" placeholder="${S.esc(opts.placeholder || '')}"></label>
        <button class="btn block ${opts.danger ? 'danger' : ''}">${S.esc(opts.ok || 'Save')}</button></form>`, { onClose: () => resolve(null) });
      sh.el.querySelector('form').onsubmit = e => { e.preventDefault(); const v = e.target.v.value; sh.root.remove(); resolve(v); };
    });
  };

  // ---------- Icons (inline SVG, stroke style) ----------
  const P = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    orders: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    wallet: '<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="15" r="1.2"/>',
    star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    back: '<path d="M15 5l-7 7 7 7"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/>',
    box: '<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
    chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    store: '<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0 2.7 2.7 0 005.3 0"/><path d="M5 11v9h14v-9"/>',
    bike: '<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l4-7h5l3 7M10 10l-1-3H7M15 10l1-3h2"/>',
    route: '<circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 000-6H9a3 3 0 010-6h7"/>',
    coins: '<ellipse cx="9" cy="7" rx="6" ry="3"/><path d="M3 7v4c0 1.7 2.7 3 6 3s6-1.3 6-3V7"/><path d="M9 14v3c0 1.7 2.7 3 6 3s6-1.3 6-3v-4c0-1.7-2.7-3-6-3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    refresh: '<path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    loan: '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
    tool: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2.5-2.5z"/>',
  };
  S.icon = name => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" stroke="currentColor" aria-hidden="true">${P[name] || ''}</svg>`;

  // ---------- Tabs ----------
  S.tabbar = function (tabs, current, onPick) {
    let bar = S.$('.tabbar');
    if (!bar) { bar = document.createElement('nav'); bar.className = 'tabbar'; bar.setAttribute('aria-label', 'Main'); document.body.appendChild(bar); }
    bar.innerHTML = '<div class="tabbar-inner">' + tabs.map(t =>
      `<button class="tab ${t.id === current ? 'active' : ''}" data-tab="${t.id}" aria-current="${t.id === current ? 'page' : 'false'}">
        ${S.icon(t.icon)}<span>${S.esc(t.label)}</span>${t.badge ? `<b class="badge">${t.badge}</b>` : ''}</button>`).join('') + '</div>';
    bar.onclick = e => { const b = e.target.closest('[data-tab]'); if (b) onPick(b.dataset.tab); };
  };

  // ---------- Order status helpers ----------
  S.STEPS = { Delivery: ['Pending', 'Preparing', 'Ready', 'On the way', 'Completed'], Booking: ['Pending', 'Confirmed', 'Completed'] };
  S.statusText = o => ({
    Pending: o.Kind === 'Booking' ? 'Waiting for the provider to confirm your booking' : 'Waiting for the merchant to accept',
    Preparing: 'The merchant is preparing your order' + (o.RiderName ? ' · Rider ' + o.RiderName + ' assigned' : ''),
    Ready: o.RiderName ? 'Ready · TSKI rider ' + o.RiderName + ' is picking it up' : 'Ready · assigning a TSKI rider',
    'On the way': 'TSKI rider ' + (o.RiderName || '') + ' is on the way to you',
    Confirmed: 'Booking confirmed for ' + S.when(o.ScheduledAt), Completed: 'Completed', Cancelled: 'Cancelled',
  }[o.Status] || o.Status);
  S.statusPill = s => {
    const cls = { Pending: 'coral', Preparing: 'mango', Ready: 'mango', 'On the way': 'mango', Confirmed: 'mango', Completed: 'green', Cancelled: 'grey' }[s];
    return `<span class="pill ${cls === undefined ? 'grey' : cls}">${S.esc(s)}</span>`;
  };
  S.steps = o => {
    if (o.Status === 'Cancelled') return '';
    const steps = S.STEPS[o.Kind] || S.STEPS.Delivery;
    const i = steps.indexOf(o.Status);
    return '<div class="steps">' + steps.map((s, j) => `<i class="${j < i || o.Status === 'Completed' ? 'done' : j === i ? 'now' : ''}"></i>`).join('') + '</div>';
  };
  S.itemsText = o => (o.items || []).map(i => `${i.qty}× ${S.esc(i.name)}`).join(', ');

  S.orderSummary = o => `<table class="sum">
    ${(o.items || []).map(i => `<tr><td>${i.qty}× ${S.esc(i.name)}</td><td>${S.peso(i.total)}</td></tr>`).join('')}
    ${o.DeliveryFee ? `<tr><td class="muted">Delivery fee</td><td>${S.peso(o.DeliveryFee)}</td></tr>` : ''}
    <tr class="total"><td>Total (${o.PaymentMethod === 'Online' ? 'online' : 'cash'})</td><td>${S.peso(o.AmountDue)}</td></tr></table>`;

  // ---------- Order chat ----------
  S.openChat = function (orderId, title, guestToken) {
    const myType = { customer: 'Customer', merchant: 'Merchant', rider: 'Rider', admin: 'TSKI' }[S.role];
    const sh = S.sheet(title || 'Order chat', `
      <p class="small muted" style="margin-bottom:8px">Everyone on this order can read these messages: customer, merchant, TSKI rider and TSKI staff.</p>
      <div class="chat-log" id="chatLog"><p class="muted small center">Loading messages…</p></div>
      <form class="row" id="chatForm"><input class="input grow" name="m" maxlength="500" autocomplete="off" placeholder="Type a message" aria-label="Message">
      <button class="btn">Send</button></form>`, { onClose: () => clearInterval(timer) });
    const log = sh.el.querySelector('#chatLog');
    let last = '';
    const render = msgs => {
      const sig = msgs.map(m => m.MessageID).join();
      if (sig === last) return; last = sig;
      log.innerHTML = msgs.length ? msgs.map(m => `<div class="msg ${m.SenderType === myType ? 'me' : ''}">
        <small>${S.esc(m.SenderType === myType ? 'You' : m.SenderName + ' · ' + m.SenderType)} · ${S.when(m.CreatedAt)}</small>${S.esc(m.Message)}</div>`).join('')
        : '<p class="muted small center">No messages yet. Say hello!</p>';
      log.scrollTop = log.scrollHeight;
    };
    const get = () => guestToken ? S.api('guestGetChat', { orderId, token: guestToken }) : S.api('getChat', { orderId });
    const load = () => get().then(render).catch(() => {});
    load();
    const timer = setInterval(load, 5000);
    sh.el.querySelector('#chatForm').onsubmit = async e => {
      e.preventDefault();
      const input = e.target.m, text = input.value.trim();
      if (!text) return;
      input.value = '';
      try { render(await (guestToken ? S.api('guestSendChat', { orderId, token: guestToken, message: text }) : S.api('sendChat', { orderId, message: text }))); } catch (err) { input.value = text; S.error(err); }
    };
  };

  // ---------- Change password (all roles) ----------
  S.changePassword = function () {
    const sh = S.sheet('Change password', `<form class="stack">
      <label class="field"><span>Current password</span><input class="input" type="password" name="oldPassword" required autocomplete="current-password"></label>
      <label class="field"><span>New password</span><input class="input" type="password" name="newPassword" minlength="6" required autocomplete="new-password"></label>
      <button class="btn block">Change password</button></form>`);
    const f = sh.el.querySelector('form');
    f.onsubmit = e => { e.preventDefault(); S.busy(f.querySelector('button'), async () => { await S.api('changePassword', S.form(f)); sh.close(); S.toast('Password changed.'); }); };
  };

  S.logout = async function () {
    try { await S.api('logout'); } catch (e) {}
    S.setToken(null);
    location.reload();
  };

  // ---------- Images: shrink before upload ----------
  S.pickImage = function () {
    return new Promise((resolve, reject) => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => {
        const file = inp.files[0];
        if (!file) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = () => reject(new Error('That file is not an image we can read.'));
        img.src = URL.createObjectURL(file);
      };
      inp.click();
    });
  };

  // ---------- PWA install ----------
  let deferredPrompt = null;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  S.isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  S.canInstall = () => !!deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredPrompt = e;
    document.dispatchEvent(new Event('installable'));
    S.showInstallBanner();
  });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; hideBanner(); S.toast('Installed! Open USWAG E-MARKET from your home screen.'); });

  S.install = async function () {
    hideBanner();
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      return;
    }
    S.sheet('Install the app', isIOS
      ? `<ol class="stack" style="padding-left:20px"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>`
      : `<ol class="stack" style="padding-left:20px"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>`);
  };

  // Install banner: shows on phones that can install, once the intro is done.
  const BANNER_KEY = 'uswag_banner_hidden_until';
  const BANNER_TEXT = {
    customer: 'Shop local and book services faster, with order updates in one tap.',
    merchant: 'Hear new orders right away and check your settlement in one tap.',
    rider: 'Get new delivery jobs faster, right from your home screen.',
    admin: 'Open the TSKI admin portal in one tap.',
  };

  function hideBanner() {
    const b = document.querySelector('.install-banner');
    if (b) { b.classList.add('bye'); setTimeout(() => b.remove(), 300); }
  }
  S.showInstallBanner = function () {
    if (S.isStandalone() || document.querySelector('.install-banner')) return;
    if (!deferredPrompt && !isIOS) return;              // this browser can't install; don't nag
    try { if (Number(localStorage.getItem(BANNER_KEY)) > Date.now()) return; } catch (e) {}
    if (document.querySelector('.intro')) { setTimeout(S.showInstallBanner, 800); return; }
    const b = document.createElement('div');
    b.className = 'install-banner';
    b.setAttribute('role', 'dialog'); b.setAttribute('aria-label', 'Install the app');
    b.innerHTML = `<img src="img/logo-96.png" alt="">
      <div><b>Install the USWAG E-MARKET app</b><div class="small muted">${S.esc(BANNER_TEXT[S.role] || BANNER_TEXT.customer)}</div></div>
      <button class="x" data-dismiss aria-label="Not now">${S.icon('x')}</button>
      <button class="btn mango" data-install>${S.icon('download')} ${isIOS && !deferredPrompt ? 'Show me how to install' : 'Install app'}</button>`;
    const place = () => { const bar = document.querySelector('.tabbar'); b.style.bottom = bar ? `calc(${bar.offsetHeight + 10}px)` : 'calc(14px + env(safe-area-inset-bottom, 0px))'; };
    place();
    document.body.appendChild(b);
    const obs = new MutationObserver(place); obs.observe(document.body, { childList: true });
    b.querySelector('[data-install]').onclick = () => { obs.disconnect(); S.install(); };
    b.querySelector('[data-dismiss]').onclick = () => {
      obs.disconnect();
      try { localStorage.setItem(BANNER_KEY, String(Date.now() + 3 * 864e5)); } catch (e) {}  // ask again in 3 days
      hideBanner();
    };
  };
  if (isIOS) setTimeout(S.showInstallBanner, 2500);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // ---------- Opening intro (once per app launch) ----------
  (function intro() {
    if (document.body.hasAttribute('data-no-intro')) return;
    try { if (sessionStorage.getItem('uswag_intro')) return; sessionStorage.setItem('uswag_intro', '1'); } catch (e) {}
    const roleLabel = { merchant: 'Merchant', rider: 'TSKI Rider', admin: 'TSKI Admin' }[S.role];
    const chain = ['FINANCE', 'MARKET', 'SELL', 'DELIVER', 'SETTLE', 'REINVEST'];
    const el = document.createElement('div');
    el.className = 'intro';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<div class="intro-stage"><svg class="intro-ring" viewBox="0 0 104 104"><circle class="dots" cx="52" cy="52" r="50"/><circle cx="52" cy="52" r="50"/></svg>
        <img class="intro-logo" src="img/logo-512.png" alt=""></div>
      <div class="intro-tag" style="margin-top:28px">Empowering Local Trade, One Click at a Time.</div>
      ${roleLabel ? `<div class="intro-role">${roleLabel}</div>` : ''}
      <div class="intro-chain">${chain.map((c, i) => `<i style="animation-delay:${(1.2 + i * 0.12).toFixed(2)}s">${c}</i>`).join('')}</div>`;
    document.body.appendChild(el);
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let done = false;
    const finish = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => el.remove(), reduce ? 320 : 640); };
    setTimeout(finish, reduce ? 700 : 2700);
    el.addEventListener('click', finish);
  })();

  // ---------- Misc ----------
  S.vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  S.beep = function () {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); o.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  };
  S.info = null;
  S.loadInfo = async () => (S.info = await S.api('publicInfo'));
})();

</script>
<script>
(function () {
  const { api, esc, peso, peso0, when, $, $$, toast, busy, sheet, icon } = S;
  const app = $('#app');
  const st = { tab: 'jobs', me: null, jobs: [], active: [], seen: null };
  let poll = null;

  async function boot() {
    try { await S.loadInfo(); } catch (e) { app.innerHTML = `<div class="auth center"><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`; return; }
    if (!S.token()) return renderAuth('login');
    try { st.me = await api('riderMe'); } catch (e) { return renderAuth('login'); }
    app.innerHTML = `<div class="shell"><header class="topbar" id="top"></header><main class="page" id="page"></main></div>`;
    go('jobs');
  }

  function renderAuth(mode) {
    app.innerHTML = `<div class="auth"><img class="auth-logo" src="img/logo-256.png" alt="USWAG E-MARKET" style="width:110px;height:110px;border-radius:50%">
      <h1 class="center" style="margin-top:6px">TSKI Rider</h1><p class="auth-sub">Deliver orders from local entrepreneurs in your municipality.</p>
      <div class="seg" style="margin-bottom:18px"><button data-m="login" class="${mode === 'login' ? 'on' : ''}">Log in</button><button data-m="signup" class="${mode === 'signup' ? 'on' : ''}">Apply as rider</button></div>
      ${mode === 'login' ? `<form class="stack" id="f"><label class="field"><span>Mobile number</span><input class="input" name="mobile" inputmode="tel" required placeholder="09171234567"></label>
        <label class="field"><span>Password</span><input class="input" type="password" name="password" required></label><button class="btn block mango">Log in</button></form>`
      : `<form class="stack" id="f"><label class="field"><span>Full name</span><input class="input" name="name" required></label>
        <label class="field"><span>Mobile number</span><input class="input" name="mobile" inputmode="tel" required placeholder="09171234567"></label>
        <label class="field"><span>TSKI branch</span><select class="input" name="branchId">${S.info.branches.map(b => `<option value="${esc(b.BranchID)}">${esc(b.Name)} · ${esc(b.Municipality)}</option>`).join('')}</select></label>
        <label class="field"><span>Vehicle</span><select class="input" name="vehicle"><option>Motorcycle</option><option>Bicycle</option><option>E-bike</option><option>Tricycle</option></select></label>
        <div class="row"><label class="field grow"><span>Plate no.</span><input class="input" name="plateNo"></label><label class="field grow"><span>Driver's license no.</span><input class="input" name="licenseNo"></label></div>
        <label class="field"><span>Password</span><input class="input" type="password" name="password" minlength="6" required></label>
        <button class="btn block mango">Send application</button>
        <p class="small muted center">TSKI screens every rider (ID, vehicle, background check) and provides training on delivery, cash handling and customer service before your first trip.</p></form>`}</div>`;
    $$('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
    const f = $('#f');
    f.onsubmit = e => { e.preventDefault(); busy(f.querySelector('button.btn.block'), async () => {
      if (mode === 'signup') { const r = await api('riderSignup', S.form(f)); app.innerHTML = `<div class="auth center"><h1>Salamat!</h1><p class="auth-sub">${esc(r.message)}</p><button class="btn" id="bk">Back to log in</button></div>`; $('#bk').onclick = () => renderAuth('login'); return; }
      const r = await api('riderLogin', S.form(f)); S.setToken(r.token); boot();
    }); };
  }

  const TABS = [{ id: 'jobs', label: 'Jobs', icon: 'route' }, { id: 'active', label: 'Deliveries', icon: 'bike' }, { id: 'cash', label: 'Cash', icon: 'coins' }, { id: 'account', label: 'Account', icon: 'user' }];
  function drawTabs() { S.tabbar(TABS.map(t => t.id === 'active' && st.active.length ? Object.assign({}, t, { badge: st.active.length }) : t), st.tab, go); }
  function topbar() {
    const on = st.me.Availability === 'Online';
    $('#top').innerHTML = `<img src="img/logo-96.png" alt="" style="width:34px;height:34px;border-radius:50%"><div class="grow"><b style="font-family:var(--display);font-size:17px;color:var(--forest)">Hi, ${esc(st.me.Name.split(' ')[0])}</b><div class="small muted">${st.me.todayDeliveries} today · ${esc(st.me.branchName)}</div></div>
      <button class="btn sm ${on ? 'leaf' : 'ghost'}" id="on" aria-pressed="${on}">${on ? 'Online' : 'Offline'}</button>`;
    $('#on').onclick = e => busy(e.currentTarget, async () => { const r = await api('setAvailability', { availability: on ? 'Offline' : 'Online' }); st.me.Availability = r.Availability; topbar(); if (st.tab === 'jobs') loadJobs(); });
  }
  function go(tab) {
    st.tab = tab; clearInterval(poll); window.scrollTo(0, 0); topbar(); drawTabs();
    ({ jobs: renderJobs, active: renderActive, cash: renderCash, account: renderAccount })[tab]();
  }

  function renderJobs() { $('#page').innerHTML = '<div id="jl"><p class="muted center" style="padding:30px">Looking for jobs…</p></div>'; loadJobs(); poll = setInterval(() => { if (!document.hidden) loadJobs(true); }, 15000); }
  async function loadJobs(quiet) {
    try { [st.jobs, st.active] = await Promise.all([api('availableJobs'), api('myDeliveries', {})]); } catch (e) { if (!quiet) S.error(e); return; }
    const ids = st.jobs.map(j => j.OrderID);
    if (st.seen && ids.some(id => st.seen.indexOf(id) < 0)) { S.beep(); S.vibrate([150, 80, 150]); }
    st.seen = ids; drawTabs();
    if (st.tab !== 'jobs') return;
    const el = $('#jl');
    if (st.me.Availability !== 'Online') { el.innerHTML = '<div class="empty"><h3>You are offline</h3>Tap <b>Offline</b> at the top to go online and see jobs in your branch.</div>'; return; }
    el.innerHTML = st.jobs.length ? '<div class="stack">' + st.jobs.map(j => `<div class="card"><div class="row between"><b>${esc(j.MerchantName)}</b>${S.statusPill(j.Status)}</div>
      <p class="small" style="margin-top:6px"><span class="muted">Pick up:</span> ${esc(j.MerchantAddress)}</p><p class="small"><span class="muted">Drop off:</span> ${esc(j.Address)}</p>
      <p class="small" style="margin-top:4px">${j.PaymentMethod === 'Cash' ? `<span class="pill mango">Collect ${peso(j.AmountDue)} cash</span>` : '<span class="pill green">Paid online</span>'}</p>
      <button class="btn block mango" style="margin-top:10px" data-take="${esc(j.OrderID)}">Accept delivery</button></div>`).join('') + '</div>'
      : '<div class="empty"><h3>No jobs right now</h3>New delivery jobs in your branch appear here with a sound.</div>';
    el.onclick = e => { const b = e.target.closest('[data-take]'); if (b) busy(b, async () => { await api('riderUpdateOrder', { orderId: b.dataset.take, action: 'accept' }); toast('Accepted. Head to the merchant.'); go('active'); }); };
  }

  async function renderActive() { $('#page').innerHTML = '<div id="al"><p class="muted center" style="padding:30px">Loading…</p></div>'; await loadActive(); poll = setInterval(() => { if (!document.hidden) loadActive(true); }, 15000); }
  async function loadActive(quiet) {
    try { st.active = await api('myDeliveries', {}); } catch (e) { if (!quiet) S.error(e); return; }
    drawTabs(); if (st.tab !== 'active') return;
    const el = $('#al');
    el.innerHTML = st.active.length ? '<div class="stack">' + st.active.map(o => {
      const cash = o.PaymentMethod === 'Cash', onway = o.Status === 'On the way';
      return `<div class="card"><div class="row between"><b>${esc(o.MerchantName)}</b>${S.statusPill(o.Status)}</div>${S.steps(o)}
        <div class="list" style="margin-top:10px">
          <div class="list-item"><div class="grow"><div class="small muted">1 · Pick up</div><b>${esc(o.MerchantAddress)}</b></div>${o.MerchantMobile ? `<a class="btn icon" href="tel:${esc(o.MerchantMobile)}" aria-label="Call merchant">${icon('phone')}</a>` : ''}</div>
          <div class="list-item"><div class="grow"><div class="small muted">2 · Deliver to ${esc(o.CustomerName)}</div><b>${esc(o.Address)}</b>
            <div class="small" style="font-weight:700;color:${cash ? 'var(--mango)' : 'var(--green)'}">${cash ? 'Collect ' + peso(o.AmountDue) + ' cash' : 'Paid online · collect nothing'}</div></div>
            <a class="btn icon" href="tel:${esc(o.CustomerMobile)}" aria-label="Call customer">${icon('phone')}</a></div></div>
        <p class="small muted" style="margin-top:8px">${S.itemsText(o)}${o.Notes ? ' · ' + esc(o.Notes) : ''}</p>
        <div class="row" style="margin-top:10px">${!onway ? (o.Status === 'Ready' ? `<button class="btn mango grow" data-a="pickup" data-id="${esc(o.OrderID)}">Picked up from merchant</button>` : '<button class="btn grow" disabled>Waiting for merchant</button>')
          : `<button class="btn leaf grow" data-a="deliver" data-id="${esc(o.OrderID)}">Deliver · enter customer code</button>`}
          <button class="btn ghost" data-chat="${esc(o.OrderID)}" aria-label="Chat">${icon('chat')}</button></div>
        ${!onway ? `<button class="btn sm ghost block" style="margin-top:8px" data-a="release" data-id="${esc(o.OrderID)}">Give this job back</button>` : ''}</div>`;
    }).join('') + '</div>' : `<div class="empty"><h3>No deliveries in progress</h3><button class="btn" id="tj">See jobs</button></div>`;
    const tj = $('#tj'); if (tj) tj.onclick = () => go('jobs');
    el.onclick = e => {
      const c = e.target.closest('[data-chat]'); if (c) return S.openChat(c.dataset.chat, 'Order chat');
      const a = e.target.closest('[data-a]'); if (!a) return;
      const o = st.active.find(x => x.OrderID === a.dataset.id);
      if (a.dataset.a === 'deliver') return deliver(o);
      (async () => {
        if (a.dataset.a === 'release' && !await S.confirm('Give this job back?', 'Another rider can take it.', 'Give back', true)) return;
        busy(a, async () => { await api('riderUpdateOrder', { orderId: o.OrderID, action: a.dataset.a }); toast(a.dataset.a === 'pickup' ? 'On the way to the customer.' : 'Job given back.'); loadActive(); });
      })();
    };
  }
  function deliver(o) {
    const cash = o.PaymentMethod === 'Cash';
    const sh = sheet('Deliver to ' + o.CustomerName, `<form class="stack" id="df">
      ${cash ? `<div class="banner"><strong>Collect ${peso(o.AmountDue)} cash first.</strong></div>` : ''}
      <label class="field"><span>Customer's 4-digit code</span><input class="input otp-in" name="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code" required placeholder="••••"></label>
      <p class="small muted">The customer sees this code in their USWAG app. It confirms they received the order.</p>
      <button class="btn block leaf">Confirm delivery</button>
      <button type="button" class="btn sm ghost block" id="nocode">${icon('camera')} Customer can't give the code</button></form>`);
    const f = sh.el.querySelector('#df');
    f.onsubmit = e => { e.preventDefault(); busy(f.querySelector('button.leaf'), async () => { await api('riderUpdateOrder', { orderId: o.OrderID, action: 'deliver', otp: f.otp.value }); sh.close(); done(o); }); };
    sh.el.querySelector('#nocode').onclick = () => {
      sh.close();
      let photo = null;
      const p = sheet('Photo proof of delivery', `<form class="stack" id="pp"><p class="muted">Take a photo of the delivered order (and the receiver if possible). TSKI staff will review it.</p>
        <button type="button" class="btn ghost" id="ph">${icon('camera')} Take or choose photo</button><div id="pv"></div>
        <label class="field"><span>Why couldn't the code be used?</span><input class="input" name="note" required placeholder="e.g. Received by family member"></label>
        <button class="btn block leaf">Confirm delivery with photo</button></form>`);
      p.el.querySelector('#ph').onclick = async () => { try { photo = await S.pickImage(); if (photo) p.el.querySelector('#pv').innerHTML = `<img src="${photo}" alt="" style="border-radius:12px;max-height:200px">`; } catch (err) { S.error(err); } };
      const g = p.el.querySelector('#pp');
      g.onsubmit = e => { e.preventDefault(); busy(g.querySelector('button.leaf'), async () => { if (!photo) throw new Error('Take a photo first.'); await api('riderUpdateOrder', { orderId: o.OrderID, action: 'deliver', proofDataUrl: photo, proofNote: g.note.value }); p.close(); done(o); }); };
    };
  }
  async function done(o) { st.me = await api('riderMe'); topbar(); toast('Delivered!' + (o.PaymentMethod === 'Cash' ? ' Keep the ' + peso0(o.AmountDue) + ' for remittance.' : '')); loadActive(); }

  async function renderCash() {
    $('#page').innerHTML = '<p class="muted center" style="padding:30px">Loading…</p>';
    let hist; try { [st.me, hist] = await Promise.all([api('riderMe'), api('myDeliveries', { scope: 'history' })]); } catch (e) { return S.error(e); }
    if (st.tab !== 'cash') return; topbar();
    const r = st.me;
    $('#page').innerHTML = `<div class="cashcard"><span class="small" style="opacity:.85">Cash to remit to your TSKI branch</span><b>${peso(r.cashToRemit)}</b><span class="small" style="opacity:.85">from ${r.cashOrders} cash order${r.cashOrders === 1 ? '' : 's'} · remit at end of day</span></div>
      <div class="stat-grid" style="margin-top:12px"><div class="stat"><b>${r.todayDeliveries}</b><span>Deliveries today</span></div><div class="stat"><b>${r.Deliveries}</b><span>Total deliveries</span></div></div>
      <div class="section-title"><h3>Reconciliations</h3></div>
      ${r.recon.length ? '<div class="list">' + r.recon.map(x => `<div class="list-item"><div class="grow"><b>${when(x.CreatedAt)}</b><div class="small muted">${x.Orders} orders · expected ${peso0(x.Expected)} · remitted ${peso0(x.Remitted)}</div></div>
        <span class="pill ${x.Variance === 0 ? 'green' : 'red'}">${x.Variance === 0 ? 'Balanced' : (x.Variance > 0 ? '+' : '') + peso0(x.Variance)}</span></div>`).join('') + '</div>' : '<div class="empty">No reconciliations yet.</div>'}
      <div class="section-title"><h3>Recent deliveries</h3></div>
      ${hist.length ? '<div class="list">' + hist.map(o => `<div class="list-item"><div class="grow"><b>${esc(o.MerchantName)}</b><div class="small muted">${when(o.CompletedAt || o.UpdatedAt)} · ${esc(o.CustomerName)}${o.ProofURL ? ' · photo proof' : ''}</div></div>
        ${o.Status === 'Completed' ? `<b class="num">${o.CollectedBy === 'Rider' ? peso0(o.CashCollected) : 'Online'}</b>` : S.statusPill(o.Status)}</div>`).join('') + '</div>' : '<div class="empty">No deliveries yet.</div>'}`;
  }

  function renderAccount() {
    const r = st.me;
    $('#page').innerHTML = `<div class="row" style="margin-bottom:16px"><div class="avatar">${S.initial(r.Name)}</div><div><h2>${esc(r.Name)}</h2><div class="small muted">${esc(r.Mobile)} · ${esc(r.Vehicle)} ${esc(r.PlateNo)}</div></div></div>
      <div class="list">${S.isStandalone() ? '' : '<div class="list-item tap" id="inst"><div class="grow"><b>Install the app</b></div></div>'}
        <div class="list-item tap" id="pw"><div class="grow"><b>Change password</b></div></div><div class="list-item tap" id="out"><div class="grow"><b style="color:var(--coral)">Log out</b></div></div></div>
      <div class="banner" style="margin-top:16px"><strong>Delivery rules:</strong> confirm every delivery with the customer's 4-digit code (or a photo if they can't give it). Collect cash only for cash orders, and remit all cash to your TSKI branch at the end of the day.</div>`;
    const i = $('#inst'); if (i) i.onclick = S.install;
    $('#pw').onclick = S.changePassword;
    $('#out').onclick = async () => { if (!await S.confirm('Log out?', 'You will go offline.', 'Log out')) return; try { await api('setAvailability', { availability: 'Offline' }); } catch (e) {} S.logout(); };
  }

  boot();
})();
</script>
</body>
</html>
